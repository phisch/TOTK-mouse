[package]
name = "totk-mouse"
version = "0.1.0-alpha.4"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
gpui = { package = "gpui-unofficial", version = "1.25.3", optional = true }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.25.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "res"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["ui"]
# The window. Without it the companion runs in the terminal only.
ui = ["dep:gpui", "dep:gpui_platform"]

[profile.release]
lto = true
